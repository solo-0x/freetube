name: Build LiveContainer IPA
on:
  push:
    paths:
      - 'FreeTube/**'
      - '.github/workflows/livecontainer-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project FreeTube/FreeTube.xcodeproj -scheme FreeTube \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ENABLE_DEBUG_DYLIB=NO \
            build 2>&1 | tee build.log
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/FreeTube.app
          test -d "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          lipo "$APP/$EXECUTABLE" -verify_arch arm64
          otool -l "$APP/$EXECUTABLE" > macho.txt
          if grep -A5 LC_ENCRYPTION_INFO macho.txt | grep -Eq 'cryptid +[1-9]'; then
            echo 'Encrypted executable cannot run in LiveContainer'
            exit 1
          fi
          mkdir -p build/ipa/Payload dist
          ditto "$APP" build/ipa/Payload/FreeTube.app
          (cd build/ipa && zip -qry ../../dist/FreeTube-LiveContainer.ipa Payload)
          shasum -a 256 dist/FreeTube-LiveContainer.ipa > dist/SHA256SUMS.txt
          printf 'Source: %s\nMinimum iOS: 17.0\nArchitecture: arm64\nUnsigned, unencrypted device build. Import into LiveContainer; guest signing is managed by LiveContainer. Physical-device compatibility has not been verified.\n' "$GITHUB_SHA" > dist/BUILD-INFO.txt
          unzip -t dist/FreeTube-LiveContainer.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTube-LiveContainer-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
